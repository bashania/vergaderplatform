name: Tests

# Elke wijziging wordt gebouwd en doorloopt de volledige test tegen een lokale server met een lege
# database. Er is geen verbinding met Netlify en er zijn geen geheimen nodig.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecontrole en bouwen
        run: npm run build
      - name: Herkenning van geplakte agenda's
        run: npm run test:parse
      - name: Lokale server met lege database
        run: scripts/start-test-server.sh
      - name: Volledige test van de API
        run: npm run test:e2e
      - name: Logboek van de server
        if: failure()
        run: tail -n 200 dev.log
