name: Tests

# Elke wijziging wordt gebouwd en doorloopt de volledige test tegen een lokale server met een lege
# database. Er is geen verbinding met Netlify en er zijn geen geheimen nodig.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecontrole en bouwen
        run: npm run build
      - name: Herkenning van geplakte agenda's
        run: npm run test:parse
      - name: Lokale server met lege database
        run: scripts/start-test-server.sh
      - name: Volledige test van de API
        run: npm run test:e2e
        env:
          BACKUP_OUT: backup.json
      - name: De back-up terugzetten op een leeg platform
        run: |
          scripts/start-test-server.sh
          BACKUP=backup.json node scripts/restore-test.mjs
      - name: Logboek van de server
        if: failure()
        run: tail -n 200 dev.log

  # De schermen in drie browsers: het stuk op het scherm, het presentatiescherm en meekijken zonder
  # account, met drie schermen tegelijk. WebKit is de browsermotor van Safari.
  browser:
    name: Schermen in ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bouwen
        run: npm run build
      - name: Browsers voor de test
        # Chromium is ook nodig voor de demogegevens: het maakt de pdf's waar de test mee werkt.
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium ${{ matrix.browser }}
      - name: Lokale server met lege database
        run: scripts/start-test-server.sh
      - name: Demogegevens
        run: node scripts/film/seed-demo.cjs > demo.json
      - name: Stuk op het scherm, presentatiescherm en meekijken
        run: node scripts/browser-test.cjs demo.json
        env:
          BROWSER: ${{ matrix.browser }}
          OUT: schermafbeeldingen
      - name: Schermafbeeldingen bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schermafbeeldingen-${{ matrix.browser }}
          path: schermafbeeldingen
          if-no-files-found: ignore
          retention-days: 7
      - name: Logboek van de server
        if: failure()
        run: tail -n 200 dev.log

  # Toegankelijkheid: elk scherm langs WCAG 2.2 A en AA op drie breedtes, plus toetsenbord, paginatitels
  # en of het scherm op een smalle telefoon in de breedte past.
  toegankelijkheid:
    name: Toegankelijkheid
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bouwen
        run: npm run build
      - name: Browser voor de test
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Lokale server met lege database
        run: scripts/start-test-server.sh
      - name: Demogegevens
        run: node scripts/film/seed-demo.cjs > demo.json
      - name: Schermen nalopen
        run: node scripts/a11y-test.cjs demo.json
        env:
          OUT: schermafbeeldingen
      - name: Schermafbeeldingen van wat misging bewaren
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schermafbeeldingen-toegankelijkheid
          path: schermafbeeldingen
          if-no-files-found: ignore
          retention-days: 7
      - name: Logboek van de server
        if: failure()
        run: tail -n 200 dev.log
